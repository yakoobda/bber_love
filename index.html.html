```html
<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Senin İçin ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            color: white;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 20% 20%,
                    rgba(255,182,193,0.4),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 80% 30%,
                    rgba(221,160,221,0.3),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 50% 90%,
                    rgba(255,218,224,0.3),
                    transparent 40%
                ),

                linear-gradient(
                    135deg,
                    #160b18,
                    #24111f,
                    #180d20
                );
        }


        /* =========================
           STARS
        ========================= */

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .star {

            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: white;

            opacity: 0.5;

            animation:
                twinkle 2s
                infinite alternate;
        }


        @keyframes twinkle {

            from {
                opacity: 0.2;
                transform: scale(0.7);
            }

            to {
                opacity: 0.9;
                transform: scale(1.3);
            }

        }


        /* =========================
           CARD
        ========================= */

        .card {

            width: min(90%, 520px);

            padding: 45px 30px;

            text-align: center;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.18);

            border-radius: 28px;

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            box-shadow:

                0 20px 70px
                rgba(0,0,0,0.45),

                0 0 60px
                rgba(255,130,170,0.08);

            position: relative;

            z-index: 10;

            animation:
                appear 0.8s ease;
        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================
           HEART
        ========================= */

        .heart {

            font-size: 70px;

            margin-bottom: 20px;

            animation:
                heartbeat 1.4s infinite;

            filter:
                drop-shadow(
                    0 0 20px
                    rgba(255,71,126,0.7)
                );
        }


        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

        }


        /* =========================
           TEXT
        ========================= */

        h1 {

            font-size: 32px;

            font-weight: 600;

            margin-bottom: 25px;
        }


        p {

            font-size: 19px;

            line-height: 1.8;

            color: #f5dfe7;

            margin: 0;
        }


        .question {

            margin-top: 20px;

            font-size: 21px;

            font-weight: bold;

            color: white;
        }


        /* =========================
           BUTTON AREA
        ========================= */

        .buttons {

            margin-top: 35px;

            width: 100%;

            height: 170px;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            gap: 20px;
        }


        /* =========================
           BUTTONS
        ========================= */

        button {

            padding: 14px 32px;

            border: none;

            border-radius: 50px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            white-space: nowrap;
        }


        /* =========================
           YES
        ========================= */

        #yes {

            position: relative;

            background:
                linear-gradient(
                    135deg,
                    #ff477e,
                    #ff6f9a
                );

            color: white;

            box-shadow:
                0 8px 25px
                rgba(255,71,126,0.35);

            z-index: 2;

            transition:
                transform 0.25s,
                box-shadow 0.25s;
        }


        #yes:hover {

            transform: scale(1.08);

            box-shadow:
                0 10px 35px
                rgba(255,71,126,0.55);
        }


        /* =========================
           NO
        ========================= */

        #no {

            position: relative;

            left: auto;

            top: auto;

            background:
                rgba(255,255,255,0.12);

            color: white;

            border:
                1px solid
                rgba(255,255,255,0.22);

            z-index: 5;

            transition:
                left 0.15s ease,
                top 0.15s ease;
        }


        #no:hover {

            background:
                rgba(255,255,255,0.20);
        }


        /* =========================
           HIDDEN
        ========================= */

        .hidden {
            display: none;
        }


        /* =========================
           FLOATING HEARTS
        ========================= */

        .floating-heart {

            position: fixed;

            bottom: -40px;

            pointer-events: none;

            z-index: 1;

            animation:
                floatUp
                linear
                forwards;
        }


        @keyframes floatUp {

            from {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            to {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width:600px) {

            .card {

                width: 90%;

                padding:
                    38px 22px;
            }

            .heart {
                font-size: 60px;
            }

            h1 {
                font-size: 27px;
            }

            p {
                font-size: 17px;
            }

            .question {
                font-size: 19px;
            }

            button {

                padding:
                    13px 27px;

                font-size: 16px;
            }

            .buttons {

                height: 170px;

                gap: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- STARS -->

    <div
        class="stars"
        id="stars">
    </div>


    <!-- =========================
         MAIN CARD
    ========================= -->

    <div
        class="card"
        id="mainCard">


        <div class="heart">
            ❤️
        </div>


        <h1>
            Sana bir şey sormak istiyorum...
        </h1>


        <p>
            Seni gerçekten çok seviyorum.
        </p>


        <p>
            Ve bunu bilmek istiyorum...
        </p>


        <p class="question">
            Sen de beni aynı şekilde seviyor musun? ❤️
        </p>


        <div
            class="buttons"
            id="buttonArea">


            <button id="yes">
                EVET ❤️
            </button>


            <button id="no">
                HAYIR
            </button>


        </div>

    </div>


    <!-- =========================
         YES RESULT
    ========================= -->

    <div
        class="card hidden"
        id="yesCard">


        <div class="heart">
            ❤️
        </div>


        <h1>
            Biliyordum ❤️
        </h1>


        <p>
            Seni seviyorum.
        </p>


    </div>


    <!-- =========================
         NO RESULT
    ========================= -->

    <div
        class="card hidden"
        id="noCard">


        <div class="heart">
            🤍
        </div>


        <h1>
            Dürüst olduğun için teşekkür ederim.
        </h1>


        <p>
            Cevabına saygı duyuyorum. ❤️
        </p>


    </div>


    <script>


        /* =========================
           STARS
        ========================= */

        const stars =
            document.getElementById("stars");


        for (
            let i = 0;
            i < 70;
            i++
        ) {

            const star =
                document.createElement("div");


            star.className =
                "star";


            star.style.left =
                Math.random() * 100 + "vw";


            star.style.top =
                Math.random() * 100 + "vh";


            star.style.animationDelay =
                Math.random() * 2 + "s";


            stars.appendChild(star);

        }


        /* =========================
           ELEMENTS
        ========================= */

        const yes =
            document.getElementById("yes");


        const no =
            document.getElementById("no");


        const mainCard =
            document.getElementById("mainCard");


        const yesCard =
            document.getElementById("yesCard");


        const noCard =
            document.getElementById("noCard");


        const buttonArea =
            document.getElementById("buttonArea");


        /* =========================
           SEND ANSWER
        ========================= */

        async function sendAnswer(answer) {

            const formData =
                new FormData();


            formData.append(
                "answer",
                answer
            );


            formData.append(
                "_subject",
                "Someone answered your question ❤️"
            );


            try {

                await fetch(
                    "https://formspree.io/f/xrpzyzop",
                    {
                        method: "POST",

                        body: formData,

                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );

            }

            catch (error) {

                console.log(
                    "Could not send answer."
                );

            }

        }


        /* =========================
           YES
        ========================= */

        yes.addEventListener(
            "click",
            function () {

                sendAnswer(
                    "EVET ❤️"
                );


                mainCard.classList.add(
                    "hidden"
                );


                yesCard.classList.remove(
                    "hidden"
                );


                createManyHearts();

            }
        );


        /* =========================
           NO ESCAPE
        ========================= */

        let attempts = 0;


        no.addEventListener(
            "mouseenter",
            moveNo
        );


        function moveNo() {

            attempts++;


            if (attempts > 8) {
                return;
            }


            no.style.position =
                "absolute";


            const area =
                buttonArea.getBoundingClientRect();


            const noWidth =
                no.offsetWidth;


            const noHeight =
                no.offsetHeight;


            const padding = 8;


            const maxX =
                area.width -
                noWidth -
                padding;


            const maxY =
                area.height -
                noHeight -
                padding;


            const randomX =
                padding +
                Math.random() *
                Math.max(
                    0,
                    maxX - padding
                );


            const randomY =
                padding +
                Math.random() *
                Math.max(
                    0,
                    maxY - padding
                );


            no.style.left =
                randomX + "px";


            no.style.top =
                randomY + "px";


            if (attempts >= 8) {

                no.removeEventListener(
                    "mouseenter",
                    moveNo
                );

            }

        }


        /* =========================
           NO
        ========================= */

        no.addEventListener(
            "click",
            function () {

                sendAnswer(
                    "HAYIR"
                );


                mainCard.classList.add(
                    "hidden"
                );


                noCard.classList.remove(
                    "hidden"
                );

            }
        );


        /* =========================
           FLOATING HEARTS
        ========================= */

        function createHeart() {

            const heart =
                document.createElement(
                    "div"
                );


            heart.className =
                "floating-heart";


            const types = [

                "❤️",
                "💕",
                "💗",
                "✨"

            ];


            heart.innerHTML =
                types[
                    Math.floor(
                        Math.random() *
                        types.length
                    )
                ];


            heart.style.left =
                Math.random() * 100 +
                "vw";


            heart.style.fontSize =
                (
                    15 +
                    Math.random() * 20
                ) + "px";


            heart.style.animationDuration =
                (
                    5 +
                    Math.random() * 5
                ) + "s";


            document.body.appendChild(
                heart
            );


            setTimeout(
                function () {

                    heart.remove();

                },
                10000
            );

        }


        setInterval(
            createHeart,
            800
        );


        /* =========================
           MANY HEARTS
        ========================= */

        function createManyHearts() {

            for (
                let i = 0;
                i < 30;
                i++
            ) {

                setTimeout(
                    createHeart,
                    i * 100
                );

            }

        }

    </script>

</body>

</html>
